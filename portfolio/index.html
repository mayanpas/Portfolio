<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preload" as="image" href="./src/assets/FotosPerfil/perfil1.jpg" />
    <link rel="preload" as="image" href="./src/assets/FotosPerfil/perfil2.jpg" />
    <link rel="preload" as="image" href="./src/assets/Backgrounds/light.jpg" />
    <link rel="preload" as="image" href="./src/assets/Backgrounds/dark.jpg" />
    <link
      rel="preload"

    <link
      rel="preload"

      href="./src/assets/Backgrounds/Mobile/dark.jpg"

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="Portfólio pessoal" />
    <meta id="theme-color-meta" name="theme-color" content="#ffffff">
    <title>Portfólio | Mayan Patrick</title>
    <!-- SCRIPT ANTI-PISCO (FOUC) -->
    <script>
      (function () {
        try {
          /* Verifica se você salvou o tema no localStorage (ajuste o nome da chave se necessário) */
          var localTheme = localStorage.getItem("theme");
          /* Verifica a preferência de cor do sistema operacional do usuário */
          var sysTheme = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;

          /* Se tiver salvo dark, ou se não tiver nada salvo mas o PC dele for dark, aplica a classe imediatamente */
          if (localTheme === "dark" || (!localTheme && sysTheme)) {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>
    <!-- Fim do script -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
